[project]
name = "aiopulse"
version = "0.0.4"
description = "A lightweight asynchronous callback invocation and execution library for Python."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "GrehBan", email = "maximfeedback19@gmail.com" },
]
maintainers = [
    { name = "GrehBan", email = "maximfeedback19@gmail.com" },
]
keywords = [
    "asyncio",
    "async",
    "callbacks",
    "callback registry",
    "callback execution",
    "concurrency",
    "bounded concurrency",
    "async iterator",
    "task scheduling",
    "event-driven",
]
classifiers = [
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",

]

dependencies = [
    "typing-extensions>=4.16.0",
]

[project.urls]
Homepage = "https://github.com/GrehBan/aiopulse"
Documentation = "https://grehban.github.io/aiopulse/"
Repository = "https://github.com/GrehBan/aiopulse"
Issues = "https://github.com/GrehBan/aiopulse/issues"
Changelog = "https://github.com/GrehBan/aiopulse/blob/master/CHANGELOG.md"


[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aiopulse"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyright>=1.1.414",
    "ruff>=0.17.5",
]
test = [
    "hypothesis>=6.170.14",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "pytest-cov>=7.1.0",
    "pytest-html>=4.2.0",
    "pytest-mock>=3.17.0",
    "pytest-mypy>=1.1.0",
    "pytest-timeout>=2.4.0",
]

[tool.ruff]
line-length = 79
target-version = "py311"
src = ["src"]
extend-exclude = [
    "build",
    "dist",
    "venv",
    ".venv",
    "docs",
    "dev",
    "scripts",
    "*.egg-info",
]


[tool.ruff.lint]
select = [
    "C90", # mccabe: cyclomatic complexity, see [tool.ruff.lint.mccabe]
    "A", # flake8-builtins
    "B", # flake8-bugbear
    "C4", # flake8-comprehensions
    "D", # pydocstyle
    "DTZ", # flake8-datetimez
    "E", # pycodestyle errors
    "F", # pyflakes
    "G", # flake8-logging-format: lazy logging arguments
    "I", # isort
    "LOG", # flake8-logging
    "PERF", # perflint
    "PL", # pylint
    "Q", # flake8-quotes
    "RET", # flake8-return
    "SIM", # flake8-simplify
    "T10", # flake8-debugger
    "T20", # flake8-print
    "UP", # pyupgrade
]
ignore = [
    "A002",
    "A005",
    "B008",
    "PLC0415",
    "PLC1901",
    "PLR0904",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR0917",
    "PLR6301",
    "PLW2901",
    "PLW3201",
]


[tool.ruff.lint.mccabe]
# mccabe's own default. Every "case" of a "match" counts as a branch, so a
# lower limit flags flat dispatchers (by format, by SSE field) that read
# well as they are; 10 catches functions that have really grown.
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["aiopulse"]
required-imports = ["from __future__ import annotations"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "D", # docstrings are not required in tests
    "PLR2004", # magic values are expected in asserts
]


[tool.mypy]
python_version = "3.11"
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
explicit_package_bases=true
show_error_codes = true
show_error_context = true
pretty = true
ignore_missing_imports = false
warn_unused_configs = true
disallow_subclassing_any = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
follow_imports_for_stubs = true
namespace_packages = true
show_absolute_path = true

[tool.pyright]
include = ["src"]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false

[[tool.pyright.executionEnvironments]]
root = "tests"
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# A stuck test fails instead of hanging the run (pytest-timeout).
timeout = 30
addopts = [
    "-ra",
    "--strict-markers",
    "--cov=aiopulse",
    "--cov-branch",
    "--cov-report=term-missing",
]
markers = [
    "typing: static type checks",
]
filterwarnings = ["error"]


[tool.coverage.run]
branch = true
source = ["aiopulse"]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 98
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.$",
]
